name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests: fast, no external tools. The source of truth for the code.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Unit tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -q

  # Integration gate: export + DRC + hole checks on the bundled calibration
  # board. Needs kicad-cli (KiCad 10 files) but NOT the pcb2gcode Docker image,
  # because `check` stops before CAM.
  #
  # Checkout runs on the host, then the check runs via `docker run` in KiCad's
  # official image: a job-level `container:` with that image fails checkout
  # (its non-root USER can't write the runner's _temp files). The container runs
  # as root so it can write the mounted workspace; output goes to /tmp so nothing
  # root-owned is left behind. Bump the kicad/kicad tag if it can't load the KiCad
  # 10 files, and add `xvfb-run` before kicad-cli if it needs a display.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pcbcam check (calibration board)
        run: |
          docker run --rm --user root -v "$PWD:/w" -w /w kicad/kicad:10.0 bash -c '
            set -e
            export HOME=/root
            command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq curl; }
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            kicad-cli version
            uv run pcbcam check examples/cnc-pcb-calibration-project --out /tmp/pcbcam-out
          '
